* {

}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, Helvetica, Arial, sans-serif;
    background-color: #f5f5f7;
    padding: 16px;
}

.tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    width: 100%;
    max-width: 500px;
    margin: 0 auto 16px auto;
}

.tab {
    min-height: 50px;
    border: none;
    border-radius: 12px;
    background-color: #e8e8ed;
    color: #1d1d1f;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.tab:active {
    transform: scale(0.97);
}

.tab.active {
    background-color: #00e30b;
    color: rgb(8, 5, 5);
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

.grid-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
}

.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 54px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    text-align: center;
    transition: background-color 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
}

.btn:active {
    transform: scale(0.97);
}

.btn-link {
    background-color: #0071e3;
    color: #ffffff;
}

.btn-link:active {
    background-color: #00b55e;
}
</style>

function skapaKnappar(lista, containerId) {

    const container = document.getElementById(containerId);

    // Fastnålad knapp först, övriga knappar sorteras alfabetiskt
    const sorteradLista = [...lista].sort((a, b) => {

        // Om A är fastnålad ska A ligga först
        if (a.fastnad && !b.fastnad) return -1;

        // Om B är fastnålad ska B ligga först
        if (!a.fastnad && b.fastnad) return 1;

        // Om ingen av dem är fastnålad: sortera alfabetiskt
        return a.namn.localeCompare(b.namn, "sv");
    });

    sorteradLista.forEach(kamera => {

        const knapp = document.createElement("a");

        knapp.href = kamera.url;
        knapp.target = "_blank";
        knapp.rel = "noopener noreferrer";
        knapp.className = "btn btn-link";
        knapp.textContent = kamera.namn;

        container.appendChild(knapp);
    });
}




function visaFlik(flikId, knapp) {

    document.querySelectorAll(".tab-content")
        .forEach(flik => flik.classList.remove("active"));

    document.querySelectorAll(".tab")
        .forEach(tab => tab.classList.remove("active"));

    document.getElementById(flikId).classList.add("active");
    knapp.classList.add("active");
}
